<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nero dual-arm control</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "urdf-loader": "https://esm.sh/urdf-loader@0.12.1?deps=three@0.160.0"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>Nero dual-arm</h1>
    <span id="status" class="status disconnected">disconnected</span>
  </header>

  <main>
    <div id="viewport"></div>

    <section class="controls">
      <div class="panel" data-side="left">
        <h2>Left arm</h2>
        <div class="sliders"></div>
        <div class="buttons">
          <button class="btn-send">Send</button>
          <button class="btn-zero">Zero</button>
          <button class="btn-sync">Sync from robot</button>
        </div>
      </div>

      <div class="panel" data-side="right">
        <h2>Right arm</h2>
        <div class="sliders"></div>
        <div class="buttons">
          <button class="btn-send">Send</button>
          <button class="btn-zero">Zero</button>
          <button class="btn-sync">Sync from robot</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/static/main.js"></script>
</body>
</html>
