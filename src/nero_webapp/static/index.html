<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nero dual-arm control</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "urdf-loader": "https://esm.sh/urdf-loader@0.12.1?deps=three@0.160.0"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>Nero dual-arm</h1>
    <span id="status" class="status disconnected">disconnected</span>
    <span class="clock" id="wallclock" title="Browser wall clock — compare to the overlay burned into each camera frame to eyeball end-to-end latency">–:–:–.–</span>
  </header>

  <main>
    <div id="viewport"></div>

    <section class="controls">
      <div class="panel" data-side="left">
        <h2>Left arm</h2>
        <div class="sliders"></div>
        <div class="buttons">
          <button class="btn-send">Send</button>
          <button class="btn-zero">Zero</button>
          <button class="btn-sync">Sync from robot</button>
          <button class="btn-grav-comp" data-side="left">Gravity Comp</button>
        </div>
      </div>

      <div class="panel" data-side="right">
        <h2>Right arm</h2>
        <div class="sliders"></div>
        <div class="buttons">
          <button class="btn-send">Send</button>
          <button class="btn-zero">Zero</button>
          <button class="btn-sync">Sync from robot</button>
          <button class="btn-grav-comp" data-side="right">Gravity Comp</button>
        </div>
      </div>
    </section>
  </main>

  <div class="skeleton-controls" id="skeleton-controls">
    <h3>Skeleton Position</h3>
    <label>X <input type="range" id="skel-x" min="-3" max="3" step="0.05" value="0"><span id="skel-x-val">0.00</span></label>
    <label>Y <input type="range" id="skel-y" min="-3" max="3" step="0.05" value="0.8"><span id="skel-y-val">0.80</span></label>
    <label>Z <input type="range" id="skel-z" min="-2" max="2" step="0.05" value="0"><span id="skel-z-val">0.00</span></label>
    <label>Scale <input type="range" id="skel-scale" min="0.5" max="3" step="0.1" value="1"><span id="skel-scale-val">1.0</span></label>
  </div>

  <footer class="cameras" id="cameras">
    <div class="camera" data-cam="fisheye_left">
      <h3>Left fisheye <span class="cam-status" id="cam-status-fisheye_left">–</span></h3>
      <video id="video-fisheye_left" autoplay muted playsinline></video>
      <div class="cam-stats" id="cam-stats-fisheye_left"></div>
    </div>
    <div class="camera" data-cam="color_left">
      <h3>Left RS color <span class="cam-status" id="cam-status-color_left">–</span></h3>
      <video id="video-color_left" autoplay muted playsinline></video>
      <div class="cam-stats" id="cam-stats-color_left"></div>
    </div>
    <div class="camera" data-cam="depth_left">
      <h3>Left RS depth <span class="cam-status" id="cam-status-depth_left">–</span></h3>
      <video id="video-depth_left" autoplay muted playsinline></video>
      <div class="cam-stats" id="cam-stats-depth_left"></div>
    </div>
    <div class="camera" data-cam="fisheye_right">
      <h3>Right fisheye <span class="cam-status" id="cam-status-fisheye_right">–</span></h3>
      <video id="video-fisheye_right" autoplay muted playsinline></video>
      <div class="cam-stats" id="cam-stats-fisheye_right"></div>
    </div>
    <div class="camera" data-cam="color_right">
      <h3>Right RS color <span class="cam-status" id="cam-status-color_right">–</span></h3>
      <video id="video-color_right" autoplay muted playsinline></video>
      <div class="cam-stats" id="cam-stats-color_right"></div>
    </div>
    <div class="camera" data-cam="depth_right">
      <h3>Right RS depth <span class="cam-status" id="cam-status-depth_right">–</span></h3>
      <video id="video-depth_right" autoplay muted playsinline></video>
      <div class="cam-stats" id="cam-stats-depth_right"></div>
    </div>
  </footer>

  <script type="module" src="/static/main.js"></script>
</body>
</html>
